name: Build Android APK

on:
  workflow_dispatch:        # the "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed to publish the APK under Releases

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder (the one containing app.json)
        id: find
        run: |
          APP_JSON=$(find . -name app.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$APP_JSON" ]; then echo "app.json not found"; exit 1; fi
          echo "dir=$(dirname "$APP_JSON")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install --legacy-peer-deps

      - name: Align package versions with Expo SDK 52
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx expo install --fix -- --legacy-peer-deps

      - name: Generate the Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp android/app/build/outputs/apk/release/app-release.apk BCC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BCC-apk
          path: ${{ steps.find.outputs.dir }}/BCC.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "${{ steps.find.outputs.dir }}/BCC.apk" \
            --title "BCC app build ${{ github.run_number }}" \
            --notes "Android APK built from commit ${{ github.sha }}"
